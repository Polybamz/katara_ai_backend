version: "3.9"

services:
  katara_backend:
    container_name: katara_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - ANDROID_HOME=/usr/lib/android-sdk
    volumes:
      - ./:/app
      - android_sdk:/usr/lib/android-sdk
      - flutter_cache:/usr/local/flutter
      - ./workspaces:/workspaces
    working_dir: /app
    command: npm run dev
    restart: unless-stopped

volumes:
  android_sdk:
  flutter_cache: