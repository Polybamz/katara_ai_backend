version: "3.9"

services:
  katara_backend:
    container_name: katara_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env                       # <-- inject vars from .env into the container
    environment:
      NODE_ENV: "production"
      ANDROID_HOME: "/usr/lib/android-sdk"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GIT_USER_NAME: "${GIT_USER_NAME}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
      WORKSPACE: "/workspaces"           # <-- set workspace path as env var
    volumes:
      - ./:/app
      - android_sdk:/usr/lib/android-sdk
      - flutter_cache:/usr/local/flutter
      - ./workspaces:/workspaces   # ensure workspace is mounted & persistent
    working_dir: /app
    command: ["node", "src/server.js"]
    restart: unless-stopped

volumes:
  android_sdk:
  flutter_cache: